# Plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Auto-save every 15 min and restore when tmux starts
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# --> Gruvbox Material colors
thm_bg="#222526"
thm_fg="#d4be98"
thm_cyan="#89b482"
thm_black="#665c54"
thm_gray="#504945"
thm_magenta="#d3869b"
thm_red="#ea6962"
thm_green="#a9b665"
thm_yellow="#d8a657"
thm_blue="#7daea3"
thm_orange="#e78a4e"
thm_black4="#928374"

# General
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g allow-passthrough on
set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-justify left

# Colors
set -g status-style "bg=$thm_bg,fg=$thm_fg"
set -g message-style "bg=$thm_gray,fg=$thm_yellow"
set -g message-command-style "bg=$thm_gray,fg=$thm_blue"
set -g pane-border-style "fg=$thm_black"
set -g pane-active-border-style "fg=$thm_yellow"

# Status left: session icon + name
set -g status-left "#[bg=$thm_yellow,fg=$thm_bg,bold] #(~/.config/tmux/session-icon.sh '#S') #S #[bg=$thm_bg,fg=$thm_yellow]"
set -g status-left-length 35

# Status right: zoom indicator + date + time
set -g status-right "#{?window_zoomed_flag,#[bg=$thm_red fg=$thm_bg bold]  ZOOM  #[bg=$thm_bg],}#[bg=$thm_gray,fg=$thm_fg] %d/%m #[bg=$thm_yellow,fg=$thm_bg,bold] %H:%M "
set -g status-right-length 60

# Window tabs
set -g window-status-format "#[bg=$thm_bg,fg=$thm_black4] #I #W "
set -g window-status-current-format "#[bg=$thm_gray,fg=$thm_yellow,bold] #I #W "
set -g window-status-separator ""

# Mouse support
set -g mouse on
# Mouse drag ONLY selects — stop-selection ends the drag without copying
# (the default copy-selection would send it to the clipboard via OSC 52).
bind -T copy-mode    MouseDragEnd1Pane send -X stop-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X stop-selection
# Ctrl+C copies (with dedent) and KEEPS the selection active
bind -T copy-mode    C-c send -X copy-pipe-no-clear "~/.config/tmux/copy-dedent.sh"
bind -T copy-mode-vi C-c send -X copy-pipe-no-clear "~/.config/tmux/copy-dedent.sh"
# Enter / y copy (with dedent) and exit copy-mode (classic vim binding)
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "~/.config/tmux/copy-dedent.sh"
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "~/.config/tmux/copy-dedent.sh"
set -g base-index 1
set -g renumber-windows on

# Auto-rename window to current folder name
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Open new window in the current directory
bind c new-window -c "#{pane_current_path}"

# Splits in the current directory too
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Dev layout: nvim (70%) + opencode (30%) + bun dev minimized
bind D new-window \; \
  send-keys "nvim" Enter \; \
  split-window -h -p 30 \; \
  send-keys "opencode" Enter \; \
  split-window -v -p 20 \; \
  send-keys "bun dev" Enter \; \
  resize-pane -Z \; \
  select-pane -t 1

# Toggle zoom current pane (minimize/maximize)
bind -n M-z resize-pane -Z

# Prefix + f: fzf window search
bind f run-shell "~/.claude/scripts/tmux-windows.sh"

# Prefix + y: copy a Claude Code code block read from the transcript (not the
# screen) — source of truth, no wrapping. fzf picker with preview.
bind y run-shell "~/.claude/scripts/claude-copy-block.sh"

# Prefix + r: reload config
bind r source-file ~/.tmux.conf \; display-message "  tmux.conf reloaded"

# Fix Shift+Enter inside tmux for Claude Code
set -g extended-keys always
set -as terminal-features 'xterm*:extkeys'

# Resize panes with Option+arrow
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5
bind -n M-Right resize-pane -R 5
bind -n M-Left resize-pane -L 5

# Cmd+V paste support (macOS)
# load-buffer reads stdin; send-keys doesn't — with send-keys the "-" became
# literal text. -p uses bracketed paste: multiline content doesn't run on paste.
# Both commands need the "tmux" prefix: run-shell hands the string to /bin/sh,
# so ";" separates shell commands, not tmux ones.
bind -n M-v run "~/.config/tmux/clip.sh paste | tmux load-buffer - && tmux paste-buffer -d -p -t #{pane_id}"

# Fix Ctrl+- key (send as literal minus to neovim)
bind -n C-- send-keys C--

# vim-tmux-navigator: restore clear screen (Ctrl-l now navigates right)
bind C-l send-keys 'C-l'

# Record when each window was actually visited (used by the prefix+f switcher)
set-hook -g after-select-window 'run-shell "tmux set -w -t #{window_id} @visited $(date +%s)"'
set-hook -g client-session-changed 'run-shell "tmux set -w -t #{window_id} @visited $(date +%s)"'

# Initialize TPM (keep this at the bottom)
run '~/.tmux/plugins/tpm/tpm'
